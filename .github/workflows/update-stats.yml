name: Update game stats

on:
  schedule:
    - cron: "0 9 * * 1"   # every Monday, 09:00 UTC
  workflow_dispatch:       # "Run workflow" button in the Actions tab

# No rights by default; the one job below asks for the single right it needs.
permissions: {}

concurrency:
  group: update-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write      # needed to commit data/stats.json
    steps:
      # Actions are pinned to an exact commit so a re-pointed tag cannot change what runs here.
      # Dependabot (.github/dependabot.yml) opens a pull request when a newer version is out.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Fetch stats from Roblox
        run: python scripts/update_stats.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/stats.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Weekly game stats update"
            git push
          fi
