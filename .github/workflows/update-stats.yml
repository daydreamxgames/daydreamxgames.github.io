name: Update game stats

on:
  schedule:
    - cron: "0 9 * * 1"   # every Monday, 09:00 UTC
  workflow_dispatch:       # "Run workflow" button in the Actions tab

# No rights by default; the one job below asks for the single right it needs.
permissions: {}

concurrency:
  group: update-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write      # needed to commit data/stats.json
    steps:
      # Actions are pinned to an exact commit so a re-pointed tag cannot change what runs here.
      # Dependabot (.github/dependabot.yml) opens a pull request when a newer version is out.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Fetch stats from Roblox
        run: python scripts/update_stats.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/stats.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Weekly game stats update"
            git push
          fi
